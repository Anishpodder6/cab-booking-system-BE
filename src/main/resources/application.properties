spring.application.name=CabBookingSystem

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/cbs?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:localpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET:a-safe-placeholder-key-for-local-testing-do-not-use-in-prod}

# Hibernate/JPA Properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}