# src/test/resources/application.properties (New file for tests only)
# This uses an in-memory H2 database for fast, isolated testing.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# This creates the schema (tables) for the H2 database from scratch
# for every test class run. It only affects the temporary in-memory database.
spring.jpa.hibernate.ddl-auto=create-drop 

spring.jpa.show-sql=true