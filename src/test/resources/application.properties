# `src/test/resources/application.properties`
spring.datasource.url=jdbc:h2:mem:cbstestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Provide a sufficiently long JWT secret (>=32 bytes for HS256)
jwt.secret=test-secret-key-at-least-32-bytes-long-1234567890

# (Optional) simplify context load by skipping default security auto config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
